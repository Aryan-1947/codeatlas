<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233457D5'/%3E%3Cg stroke='white' stroke-width='2' fill='none' stroke-linecap='round'%3E%3Ccircle cx='10' cy='10' r='3' fill='white' stroke='none'/%3E%3Ccircle cx='10' cy='23' r='3' fill='white' stroke='none'/%3E%3Ccircle cx='22' cy='16' r='3' fill='white' stroke='none'/%3E%3Cpath d='M10 13v7M12.5 9.2 19.6 14.4M12.5 22.6 19.8 17.6'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CodeAtlas turns any GitHub repository into an interactive architecture diagram in seconds. Visualize codebases, click through to source, ask questions, export and share."
    />
    <title>CodeAtlas: Repository to Diagram in Seconds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply theme before first paint to avoid a flash
      (function () {
        try {
          var t = localStorage.getItem("gd-theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.backgroundColor = "#18181b";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
